description: GigaDevice GD32 PWM

compatible: "gd,gd32-pwm"

include: [base.yaml, pwm-controller.yaml, pinctrl-device.yaml]

properties:
  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  "#pwm-cells":
    const: 3

  gd,auxiliary-source-channel:
    type: int
    enum: [0, 1, 2, 3]
    description: PWM output channel whose pulse width drives the auxiliary channel

  gd,auxiliary-channel:
    type: int
    enum: [0, 1, 2, 3]
    description: Internal compare channel configured alongside the PWM output

  gd,auxiliary-pulse-ratio:
    type: array
    description: |
      Numerator and denominator used to derive the auxiliary compare value from
      the source pulse width. For example, <1 2> places the compare event at
      half of the active pulse. The denominator must be non-zero.

pwm-cells:
  - channel
  - period
  - flags
