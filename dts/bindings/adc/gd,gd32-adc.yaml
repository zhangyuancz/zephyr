description: GigaDevice GD32 ADC

# gd32 adc irq have some special cases as below:
#   1. adc number no larger than 3.
#   2. adc0 and adc1 share the same irq number.
#   3. For gd32f4xx, adc2 share the same irq number with adc0 and adc1.
#
# To cover this cases, adc_gd32 driver use node-label 'adc0', 'adc1' and
# 'adc2' to handle gd32 adc irq config directly.
#
# Sorry for the restriction, But new added gd32 adc node-label must be 'adc0',
# 'adc1' and 'adc2'.

compatible: "gd,gd32-adc"

include: [adc-controller.yaml, reset-device.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  resets:
    required: true

  clocks:
    required: true

  rcu-clock-source:
    type: int
    description: |
      Some GD32 ADC have additional clock source, like IRC14M or IRC28M.
      This property used to select the clock and related prescaler, valid
      values defined at 'dts-bindings/adc/gd32xxx.h' headers.

  gd,clock-prescaler:
    type: int
    enum: [2, 4, 6, 8]
    description: ADC input clock divisor for SoCs using the APB2 ADC clock

  gd,external-trigger-source:
    type: int
    description: |
      SoC-specific regular-group external trigger selector. When present,
      adc_read() arms the conversion and waits for the selected hardware
      event instead of issuing a software conversion trigger.

  gd,external-trigger-timeout-us:
    type: int
    default: 5000
    min: 1
    description: |
      Maximum time to wait for each external hardware trigger. A missing
      trigger completes the ADC read with -ETIMEDOUT.

  channels:
    type: int
    description: Number of external channels
    required: true

  interrupts:
    required: true

  "#io-channel-cells":
    const: 1

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

io-channel-cells:
  - input
