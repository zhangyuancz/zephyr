include: base.yaml

description: |
  GB/T 18487.1 control-pilot (CP) interface.

  Ties together the CP PWM generator, a hardware-triggered ADC measuring the CP
  positive-level voltage, an optional PWM capture for feedback, and the diode
  detection input. ADC and PWM feedback acquisition run continuously using
  interrupt callbacks after initialization; reading the CP device returns the
  latest complete values without starting a conversion. The CP state (0, 1/1',
  2/2', 3/3', 4, invalid, or unknown) is derived from the measured CP voltage
  and whether PWM is being output.

  The timer/ADC hardware configuration (prescalers, ADC trigger source, etc.)
  lives on the referenced nodes; this node only wires the resulting devices.

  Example:

      cp: control-pilot {
          compatible = "zephyr,control-pilot";
          pwms = <&pwm1 2 PWM_USEC(1000) PWM_POLARITY_NORMAL>,
                 <&pwm2 0 PWM_USEC(1000) PWM_POLARITY_NORMAL>;
          pwm-names = "cp", "feedback";
          io-channels = <&adc0 11>;
          diode-gpios = <&gpioc 2 GPIO_ACTIVE_HIGH>;
          adc-reference-millivolt = <3300>;
          sense-divider-resistors-ohms = <430000 150000>;
      };

compatible: "zephyr,control-pilot"

properties:
  pwms:
    type: phandle-array
    required: true
    description: |
      CP PWM generator (name "cp") and, optionally, a PWM capture channel for
      continuous feedback capture (name "feedback").

  pwm-names:
    type: string-array
    required: true
    description: Names for the pwms entries; must include "cp".

  io-channels:
    type: phandle-array
    required: true
    description: ADC channel measuring the (divided) CP voltage.

  io-channel-names:
    type: string-array
    description: Optional names for the io-channels entries.

  diode-gpios:
    type: phandle-array
    required: true
    description: Input asserted when the vehicle diode is detected.

  adc-reference-millivolt:
    type: int
    required: true
    min: 1
    description: ADC reference voltage in millivolts.

  sense-divider-resistors-ohms:
    type: array
    required: true
    description: |
      CP sense-divider resistance values in ohms: first the upper resistor from
      CP to the ADC sense node, then the lower resistor from the sense node to
      ground. For example, <430000 150000> gives Vadc / Vcp = 150 / (430 + 150).
      Both values must be non-zero.

  default-duty-permille:
    type: int
    default: 1000
    description: |
      PWM duty applied at init, in per mille. Defaults to 1000 (constant +12 V,
      standby / no current advertised).
