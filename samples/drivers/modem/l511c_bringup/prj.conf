# ============================================
# L511C OCPP on WS (plain WebSocket, no TLS)
# GD32E513 + MicroOcpp
# ============================================

# --- GPIO & Serial ---
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# --- Memory ---
CONFIG_HEAP_MEM_POOL_SIZE=24576
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# --- Networking (native IP stack) ---
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_SOCKETS_DNS_TIMEOUT=12000
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=15000
CONFIG_NET_CONTEXT_RCVTIMEO=y

# --- PPP L2 ---
CONFIG_NET_L2_PPP=y
CONFIG_NET_L2_PPP_OPTION_DNS_USE=y
CONFIG_NET_L2_PPP_PAP=y
CONFIG_NET_L2_PPP_PAP_USERNAME="cmnet"
CONFIG_NET_L2_PPP_PAP_PASSWORD="cmnet"
CONFIG_NET_L2_PPP_MGMT=y

# --- Modem subsystem ---
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_MODEM_MODULES=y
CONFIG_MODEM_BACKEND_UART=y
CONFIG_MODEM_PPP=y
CONFIG_MODEM_PIPE=y

# --- HTTP & WebSocket Client (plain, no TLS) ---
CONFIG_HTTP_CLIENT=y
CONFIG_WEBSOCKET_CLIENT=y
# WebSocket needs SHA-1 for key exchange (via PSA crypto)
CONFIG_PSA_WANT_ALG_SHA_1=y
CONFIG_WEBSOCKET_MAX_CONTEXTS=1

# --- Network buffers ---
CONFIG_NET_BUF_RX_COUNT=30
CONFIG_NET_BUF_TX_COUNT=30
CONFIG_NET_BUF_DATA_SIZE=256

# --- Logging (immediate mode, no drop) ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_LOG_MODE_IMMEDIATE=y

# --- Random ---
CONFIG_TEST_RANDOM_GENERATOR=y

# --- POSIX ---
CONFIG_POSIX_API=y

# --- C++ support ---
CONFIG_CPP=y
