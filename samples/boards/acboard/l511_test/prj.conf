CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_LOG=y
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

# L511 cellular modem driver (auto-enabled from the DT node).
CONFIG_MODEM_LYNQ_L511=y

# Networking over PPP.
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_L2_PPP=y
CONFIG_NET_L2_PPP_PAP=y
CONFIG_NET_L2_PPP_PAP_USERNAME="cmnet"
CONFIG_NET_L2_PPP_PAP_PASSWORD="cmnet"
CONFIG_NET_L2_PPP_OPTION_DNS_USE=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_CONNECTION_MANAGER=y

# Random source: GD32F527 hardware TRNG seeds a xoshiro PRNG for sys_rand_get.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_GD32_TRNG=y
CONFIG_XOSHIRO_RANDOM_GENERATOR=y
