CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FSTAB_AUTOMOUNT=y

# The per-file cache heap is sized from this Kconfig; it must match the fstab
# cache-size (4096) or fs_open() fails with -ENOMEM.
CONFIG_FS_LITTLEFS_CACHE_SIZE=4096

CONFIG_PRINTK=y
CONFIG_LOG=y

# fs_dirent / LittleFS caches are sizeable.
CONFIG_MAIN_STACK_SIZE=4096
